{% set name = "borneo" %}
{% set version = "5.6.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/borneo-{{ version }}.tar.gz
  sha256: 1d79e3b048f475c10714fc3345719f66303c7129e2a1097de0deaaf85fd6c541

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - python-dateutil >=2.7.0
    - requests >=2.12.0

test:
  imports:
    - borneo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://nosql-python-sdk.readthedocs.io/en/stable/index.html
  summary: Oracle NoSQL Database Python SDK
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - beckermr
