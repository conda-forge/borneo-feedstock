{% set name = "borneo" %}
{% set version = "5.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/borneo-{{ version }}.tar.gz
  sha256: abe08ea2f719bb926aab5ab5596f6e0c63e5e3ca1e5047c591488974b3f41fb1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - python-dateutil >=2.7.0
    - requests >=2.12.0

test:
  imports:
    - borneo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://nosql-python-sdk.readthedocs.io/en/stable/index.html
  summary: Oracle NoSQL Database Python SDK
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - beckermr
