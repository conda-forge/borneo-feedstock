{% set name = "borneo" %}
{% set version = "5.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/borneo-{{ version }}.tar.gz
  sha256: 8b4b19c349e9fc4003471b6258b33e1d21ecfde743216734d770011eafd2f3d5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - python-dateutil >=2.7.0
    - requests >=2.12.0

test:
  imports:
    - borneo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://nosql-python-sdk.readthedocs.io/en/stable/index.html
  summary: Oracle NoSQL Database Python SDK
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - beckermr
